name: Windows-VST3 bauen

# Sparsamer Betrieb (GitHub-Actions-Kontingent):
# - Kein automatischer Lauf bei jedem Push. Entwickelt und getestet wird lokal bzw. ueber tests.yml (Linux, DSP-Tests).
# - Der vollstaendige Windows-Bau mit pluginval (Strictness 8) laeuft nur auf Anforderung:
#   GitHub -> Actions -> "Windows-VST3 bauen" -> "Run workflow". Er ist die abschliessende Abnahme.
# - Ein Release entsteht nur, wenn beim Start "publish" angehakt wird (Standard: aus), ausschliesslich auf main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Release mit ZIP veroeffentlichen (nur auf main)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! inputs.publish }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -notmatch '^(0|[1-9][0-9]*)\.[0-9]$') { throw "VERSION muss dem Schema 1.0 ... 1.9, 2.0 ... folgen" }
          "MOVES_VERSION=$v" >> $env:GITHUB_ENV
          "ZIP_NAME=Moves-v$v-Windows-VST3.zip" >> $env:GITHUB_ENV
          if (-not (Test-Path "docs/releases/$v.md")) { throw "Release-Hinweise fuer $v fehlen" }
          if ("${{ inputs.publish }}" -eq "true" -and "${{ github.ref }}" -ne "refs/heads/main") { Write-Error "Release nur auf main"; exit 1 }

      - name: Herstelleridentitaet pruefen
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'COMPANY_NAME\s+"Stromschlag Audio"') { throw "Hersteller muss Stromschlag Audio sein" }
          if ($cmake -match '(?i)COMPANY_NAME\s+"[^"]*(Claude|Anthropic)') { throw "Falscher Plugin-Hersteller" }

      - name: Samplebibliothek pruefen
        shell: pwsh
        run: |
          $movements = (Get-ChildItem Assets/samples/movements -Filter *.wav -ErrorAction SilentlyContinue).Count
          $breaths = (Get-ChildItem Assets/samples/breaths_sniffs -Filter *.wav -ErrorAction SilentlyContinue).Count
          if ($movements -eq 0) { throw "Keine Bewegungs-Samples gefunden - MOVES waere stumm" }
          Write-Host "$movements Bewegungs-Samples, $breaths Atem-/Schniefgeraeusche gefunden"

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Gebaute VST3-Version pruefen
        shell: pwsh
        run: |
          $bundle = "build/Moves_artefacts/Release/VST3/Moves.vst3"
          $metadata = Get-Content "$bundle/Contents/Resources/moduleinfo.json" -Raw
          $match = [regex]::Match($metadata, '"Version"\s*:\s*"([^"]+)"')
          $allowed = '^' + [regex]::Escape($env:MOVES_VERSION) + '(\.0){0,2}$'
          if (-not $match.Success -or $match.Groups[1].Value -notmatch $allowed) { throw "VST3-Metadaten passen nicht zu VERSION" }
          $native = (Get-Item "$bundle/Contents/x86_64-win/Moves.vst3").VersionInfo
          foreach ($value in @($native.FileVersion, $native.ProductVersion)) {
            if ($value -notmatch $allowed) { throw "Windows-Binaerversion $value passt nicht zu VERSION" }
          }
          Write-Host "VST3 und Windows-Binaerdatei entsprechen $env:MOVES_VERSION"

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Moves-VST3-Windows
          path: build/Moves_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 14

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate "build/Moves_artefacts/Release/VST3/Moves.vst3" 2>&1 | Tee-Object -FilePath pluginval.log
          $validationExit = $LASTEXITCODE
          if ($validationExit -ne 0 -or -not (Select-String -Path pluginval.log -Pattern '^SUCCESS\s*$' -Quiet)) {
            throw "pluginval wurde nicht vollstaendig erfolgreich abgeschlossen (Exit $validationExit)"
          }

      - name: ZIP packen
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: Compress-Archive -Path "build/Moves_artefacts/Release/VST3/Moves.vst3" -DestinationPath "$env:ZIP_NAME"

      - name: Release mit ZIP erstellen
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOVES_VERSION }}
          name: MOVES v${{ env.MOVES_VERSION }}
          make_latest: true
          files: |
            ${{ env.ZIP_NAME }}
          body_path: docs/releases/${{ env.MOVES_VERSION }}.md
